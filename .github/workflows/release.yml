name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Install client dependencies
        run: cd client && bun install --frozen-lockfile --frozen-lockfile

      - name: Build client
        run: cd client && bun run build

      - name: Build embedded release binary
        run: cargo build -p vfiles-bin --release --features embed

      - name: Package release
        run: |
          set -euo pipefail
          name="vfiles-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/${name}"
          cp target/release/vfiles "dist/${name}/vfiles"
          cp LICENSE README.md "dist/${name}/"
          cp "docs/releases/NOTES-${GITHUB_REF_NAME}.md" "dist/${name}/NOTES.md" 2>/dev/null || true
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
