name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install client dependencies
        run: cd client && bun install

      - name: Run lint
        run: cd client && bun run lint

      - name: Run unit tests
        run: cd client && bun run test:coverage

      - name: Rust fmt check
        run: cargo fmt --check

      - name: Rust check
        run: cargo check --workspace

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust test
        run: cargo test --workspace

      - name: Install WebDAV interoperability client
        run: sudo apt-get update && sudo apt-get install -y cadaver litmus rsync

      - name: Run WebDAV real-client probe
        run: ./crates/vfiles-webdav/scripts/cadaver_probe.sh

      - name: Run WebDAV conformance probe
        run: ./crates/vfiles-webdav/scripts/litmus_probe.sh

      - name: Run rsync real-client probe
        run: ./crates/vfiles-rsync/scripts/rsync_probe.sh
