name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Install client dependencies
        run: cd client && bun install --frozen-lockfile

      - name: Audit production frontend dependencies
        run: cd client && bun audit --production

      - name: Run lint
        run: cd client && bun run lint

      - name: Run typecheck
        run: cd client && bun run typecheck

      - name: Run dead-style check
        run: cd client && bun run lint:styles

      - name: Run unit tests
        run: cd client && bun run test:coverage

      - name: Build client
        run: cd client && bun run build

      - name: Check bundle size budget
        run: cd client && bun run size:check

      - name: Build server binary for UI regression
        run: cargo build -p vfiles-bin

      - name: Install Playwright Chromium
        run: cd client && bunx playwright install --with-deps chromium

      - name: Run UI regression
        run: cd client && bun run ui:regression

      - name: Install CJK fonts for visual baselines
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Run pixel visual regression
        run: cd client && bun run ui:visual

      - name: Rust fmt check
        run: cargo fmt --check

      - name: Rust check
        run: cargo check --workspace

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust test (excluding FTP)
        run: cargo test --workspace --exclude vfiles-ftp

      # FTP e2e 起真实 FTPS 服务并共享端口/TLS 状态；并行跑会偶发握手竞争。
      - name: Rust test (FTP, serial)
        run: cargo test -p vfiles-ftp -- --test-threads=1

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust security audit
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Rust dependency policy
        run: cargo deny check

      - name: Test patched HTTP request-target parsers
        run: |
          cargo test --manifest-path vendor/hyper/Cargo.toml --features full test_decoder_request
          cargo test --manifest-path vendor/h2/Cargo.toml request_parser_rejects_raw_fragment_and_accepts_encoded_hash

      - name: Install protocol interoperability clients
        run: sudo apt-get update && sudo apt-get install -y cadaver litmus python3-boto3 rclone rsync

      - name: Run WebDAV real-client probe
        run: ./crates/vfiles-webdav/scripts/cadaver_probe.sh

      - name: Run WebDAV conformance probe
        run: ./crates/vfiles-webdav/scripts/litmus_probe.sh

      - name: Run WebDAV rclone client probe
        run: ./crates/vfiles-webdav/scripts/rclone_probe.sh

      - name: Run S3 boto3 client probe
        run: ./crates/vfiles-s3/scripts/boto_probe.sh

      - name: Run S3 rclone client probe
        run: ./crates/vfiles-s3/scripts/rclone_probe.sh

      - name: Run rsync real-client probe
        run: ./crates/vfiles-rsync/scripts/rsync_probe.sh
