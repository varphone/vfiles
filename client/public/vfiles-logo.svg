<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none" role="img" aria-labelledby="vfiles-logo-title vfiles-logo-desc">
  <title id="vfiles-logo-title">VFiles logo</title>
  <desc id="vfiles-logo-desc">A folder emblem with layered files and a V-shaped revision mark beside the VFiles wordmark.</desc>
  <defs>
    <linearGradient id="folderGradient" x1="18" y1="20" x2="126" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f766e" />
      <stop offset="0.58" stop-color="#14b8a6" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="folderFrontGlow" x1="28" y1="52" x2="122" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="markGradient" x1="64" y1="52" x2="93" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="wordGradient" x1="150" y1="18" x2="230" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f766e" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="brandShadow" x="0" y="0" width="150" height="120" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  <g filter="url(#brandShadow)">
    <path d="M20 38c0-9.941 8.059-18 18-18h18.407c4.244 0 8.315 1.686 11.314 4.686L75.5 32H108c9.941 0 18 8.059 18 18v30c0 9.941-8.059 18-18 18H38c-9.941 0-18-8.059-18-18V38Z" fill="url(#folderGradient)" />
    <path d="M20 52h106v28c0 9.941-8.059 18-18 18H38c-9.941 0-18-8.059-18-18V52Z" fill="url(#folderFrontGlow)" />
  </g>
  <path d="M44 34c0-3.314 2.686-6 6-6h18.515L80 39.485V68c0 3.314-2.686 6-6 6H50c-3.314 0-6-2.686-6-6V34Z" fill="#ffffff" fill-opacity="0.3" />
  <path d="M80 39.485H70.5c-1.381 0-2.5-1.119-2.5-2.5V28L80 39.485Z" fill="#ffffff" fill-opacity="0.18" />
  <path d="M56 42c0-3.314 2.686-6 6-6h21.515L95 47.485V76c0 3.314-2.686 6-6 6H62c-3.314 0-6-2.686-6-6V42Z" fill="#fffdf7" />
  <path d="M95 47.485H85.5c-1.381 0-2.5-1.119-2.5-2.5V36L95 47.485Z" fill="#fde68a" />
  <path d="M64 60.5 74.5 73 92 51" stroke="url(#markGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M48 86c8.5-6.667 17.833-9.667 28-9 9.5.623 18 4.29 25.5 11" stroke="#fef3c7" stroke-opacity="0.85" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="48" cy="86" r="4.5" fill="#fef3c7" />
  <circle cx="73" cy="78" r="4.5" fill="#fde68a" />
  <circle cx="101.5" cy="87" r="4.5" fill="#fff7ed" />
  <text x="148" y="70" fill="url(#wordGradient)" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="56" font-weight="800" letter-spacing="-2">V</text>
  <text x="180" y="70" fill="#0f172a" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="56" font-weight="800" letter-spacing="-2">Files</text>
  <path d="M151 88H333" stroke="url(#folderGradient)" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <circle cx="349" cy="88" r="6" fill="#f59e0b" />
</svg>