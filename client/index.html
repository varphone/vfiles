<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vfiles-icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta name="description" content="VFiles - 基于Web的Git文件管理系统" />
    <title>VFiles - 文件管理系统</title>
    <meta name="theme-color" content="#edf0f4" />
    <!-- 深色主题色：与 --vf-shell-bg 一致 -->
    <meta
      name="theme-color"
      content="#0e1216"
      media="(prefers-color-scheme: dark)"
    />
    <script src="/theme-init.js"></script>
    <style>
      /* 启动占位：Vue 挂载前先给出品牌/状态反馈，避免首屏空白窗口。
         颜色直接用值：此时主题 CSS 还未加载。 */
      .app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #edf0f4;
        color: #5b6672;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
      }
      .app-boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #c9d2dc;
        border-top-color: #2f6feb;
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }
      html[data-theme="dark"] .app-boot {
        background: #0e1216;
        color: #9aa6b2;
      }
      html[data-theme="dark"] .app-boot-spinner {
        border-color: #2a3440;
        border-top-color: #5b9bff;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot" role="status" aria-live="polite">
        <span class="app-boot-spinner" aria-hidden="true"></span>
        <span>正在加载 VFiles…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
