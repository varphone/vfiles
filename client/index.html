<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vfiles-icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="VFiles - 基于Web的Git文件管理系统" />
    <title>VFiles - 文件管理系统</title>
    <meta name="theme-color" content="#f6f8fb" />
    <!-- 深色主题色（r148 ✓ 主流双条式（GitHub/Discord）✓ 实测深色底 rgb(20,22,26)） -->
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
    <script>
      // 在首屏绘制前应用已保存的主题，避免深色模式下的白屏闪烁。
      // 未保存偏好时不写 data-theme，交由 prefers-color-scheme 决定。
      (function () {
        try {
          var mode = localStorage.getItem("vfiles:theme");
          if (mode === "light" || mode === "dark") {
            document.documentElement.dataset.theme = mode;
          }
        } catch (error) {
          /* 隐私模式下 localStorage 可能不可用，忽略即可 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
