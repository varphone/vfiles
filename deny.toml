# cargo-deny configuration for release gates.
[advisories]
# `paste` is unmaintained but only used by rav1e's AVIF encoder; no safe upgrade
# exists yet (rav1e -> ravif -> image). Re-evaluate when image/ravif update.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = [
  "0BSD",
  "BSL-1.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "NCSA",
  "bzip2-1.0.6",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
