[workspace]
members = [
    "crates/vfiles-bin",
    "crates/vfiles-config",
    "crates/vfiles-domain",
    "crates/vfiles-app",
    "crates/vfiles-http",
    "crates/vfiles-infra-sqlite",
    "crates/vfiles-infra-fs",
    "crates/vfiles-test-kit",
]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/varphone/vfiles"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie", "multipart"] }
bytes = "1.0"
camino = "1.1"
clap = { version = "4.0", features = ["derive"] }
config = "0.15"
env_logger = "0.11.10"
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
include_dir = "0.7"
log = "0.4"
mime = "0.3"
mime_guess = "2.0"
rand = "0.10"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
similar = "3.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "time"] }
tempfile = "3.0"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "compression-br", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
zip = "8.5"

[workspace.lints.rust]
unused_variables = "warn"
unused_imports = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
todo = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0